name: Release to NPMjs

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pinned to the exact versions that succeeded in the 2026-05-07 release
      # of v2.13.0. Bump deliberately, not via floating `latest`.
      - name: Install semantic-release plugins
        run: npm install -g semantic-release@25.0.3 @semantic-release/changelog@6.0.3 @semantic-release/commit-analyzer@13.0.1 @semantic-release/git@10.0.1 @semantic-release/github@12.0.6 @semantic-release/npm@13.1.5 @semantic-release/release-notes-generator@14.1.0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_ACCESS: public
        run: npx semantic-release
